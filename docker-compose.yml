services:
  postgres:
    image: postgres:16-alpine
    container_name: cineverse-postgres
    restart: always
    environment:
      POSTGRES_USER: cineverse
      POSTGRES_PASSWORD: cineverse_password_2026
      POSTGRES_DB: cineverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineverse -d cineverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cineverse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineverse-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://cineverse:cineverse_password_2026@postgres:5432/cineverse
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: cineverse_super_secret_jwt_encryption_key_2026
      RAZORPAY_KEY_ID: rzp_test_cineverse123
      RAZORPAY_KEY_SECRET: secret_cineverse_test_mode
      RAZORPAY_WEBHOOK_SECRET: webhook_secret_cineverse_test
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      CATALOG_SOURCE: ${CATALOG_SOURCE:-tmdb}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineverse-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: cineverse-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  redis_data:

