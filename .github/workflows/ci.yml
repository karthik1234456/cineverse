name: CineVerse CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend:
    name: Frontend Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npm test

  backend:
    name: Backend Tests with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cineverse
          POSTGRES_PASSWORD: cineverse_password_2026
          POSTGRES_DB: cineverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://cineverse:cineverse_password_2026@localhost:5432/cineverse
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_only
          RAZORPAY_KEY_ID: rzp_test_ci123
          RAZORPAY_KEY_SECRET: secret_test_ci
        run: |
          pytest tests/test_checkout_server_quote.py tests/test_city_data_realism.py tests/test_phase9_voice_agent.py tests/test_phase11_dynamic_pricing.py tests/test_phase11_seat_scoring.py tests/test_phase11_waitlist.py tests/test_phase12_operations.py tests/test_phase4_booking_engine.py tests/test_phase5_payments.py -v
